# Turns the files in inbox/ into catalog/ for the Quest Piano Trainer app, then commits the result back.
# Runs on pushes that touch inbox/, library/ or library.toml (uploads on github.com, the app's Wi-Fi drop, a PC),
# or by hand from the Actions tab (Run workflow). See README.md.
name: Library

on:
  push:
    paths:
      - "inbox/**"
      - "library/**"
      - "library.toml"
  workflow_dispatch:
    inputs:
      retry:
        description: "Try again the files that couldn't be read"
        type: boolean
        default: false

# Commits made with GITHUB_TOKEN don't start another run, so committing back can't loop.
permissions:
  contents: write

# Runs queue instead of overlapping: each one starts from the branch as the last one left it.
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIANOPIPE_TAG: v0.1.0
      MUSESCORE_VERSION: "4.7.6"
      MUSESCORE_BUILD: "261022093"
      # Part of each MusicXML / MuseScore song's build key: a new MuseScore tries those files again.
      CONVERTER: musescore-4.7.6
    steps:
      - name: Check out the branch (its latest commit, not the pushed one)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install pianopipe
        run: |
          pip install --disable-pip-version-check -q -r .github/requirements.txt
          # The grade model isn't inside the package, so fetch it from the same tag.
          curl -fsSL -o "$RUNNER_TEMP/grade_model.json" \
            "https://raw.githubusercontent.com/JeremyAley/pianopipe/$PIANOPIPE_TAG/data/grade_model.json" || echo "no grade model: songs get no grades"

      - name: Anything for MuseScore?
        id: needs
        run: python scripts/library.py needs-musescore ${{ inputs.retry && '--retry-failed' || '' }} >> "$GITHUB_OUTPUT"

      - name: MuseScore (cached)
        if: steps.needs.outputs.musescore == 'true'
        id: mscache
        uses: actions/cache@v4
        with:
          path: ~/musescore
          key: musescore-${{ env.MUSESCORE_VERSION }}.${{ env.MUSESCORE_BUILD }}-x86_64

      - name: Download MuseScore
        if: steps.needs.outputs.musescore == 'true' && steps.mscache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/musescore && cd ~/musescore
          curl -fsSL -o mscore.AppImage \
            "https://github.com/musescore/MuseScore/releases/download/v$MUSESCORE_VERSION/MuseScore-Studio-$MUSESCORE_VERSION.$MUSESCORE_BUILD-x86_64.AppImage"
          chmod +x mscore.AppImage
          # Runners have no FUSE: unpack the AppImage instead of mounting it.
          ./mscore.AppImage --appimage-extract > /dev/null
          rm mscore.AppImage

      - name: MuseScore's libraries
        if: steps.needs.outputs.musescore == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libopengl0 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 libasound2t64 libpipewire-0.3-0t64 > /dev/null
          # Qt's offscreen platform makes MuseScore quit without writing anything, so it gets a virtual display. And
          # not setup-python's LD_LIBRARY_PATH, whose libraries MuseScore would load instead of its own.
          printf '#!/bin/sh\nunset LD_LIBRARY_PATH\nexec xvfb-run -a "$HOME/musescore/squashfs-root/AppRun" "$@"\n' > ~/mscore
          chmod +x ~/mscore
          echo "MUSESCORE=$HOME/mscore" >> "$GITHUB_ENV"

      - name: Build the catalog
        env:
          GRADE_MODEL: ${{ runner.temp }}/grade_model.json
        run: python scripts/library.py build --message-file "$RUNNER_TEMP/message.txt" ${{ inputs.retry && '--retry-failed' || '' }}

      - name: Commit the catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A inbox library catalog
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/message.txt"
          for attempt in 1 2 3; do
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            # Someone pushed while this ran (their push queued its own run). Put this commit on top and retry.
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; echo "::warning::A newer push changed the same files; the next run will redo this."; exit 0; }
          done
          exit 1
