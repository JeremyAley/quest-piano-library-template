# Settings for your piano library. Edit this file on GitHub; the next run uses them (every song is processed again).

# The library's name, shown in the app.
name = "My library"

# Finger numbers (1 thumb to 5 little finger) on every note.
fingering = true

# Convert MuseScore (.mscz) and MusicXML files with MuseScore Studio's command line. The first run that needs it
# downloads MuseScore (about 190 MB, then cached), which adds a minute or two.
musescore = true

# Sheet music for every level, shown as a book on a stand in the app. Engraved after each run's levels, so a new song
# plays at once and its book follows a few minutes later. false removes it (and saves the space its pages take).
sheets = true

# Songbook arrangements (piano with a voice or melody part above it): put the tune into the right hand as its top
# note, so the piano part plays the song on its own. MusicXML files only. One song can turn it on or off with
# "melody": true or false in its library/<song>/song.json, or name the parts: "melody": ["Voice"].
melody = false
